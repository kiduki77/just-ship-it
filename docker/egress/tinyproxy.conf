Port 3128
Timeout 600
MaxClients 64
LogLevel Notice
DisableViaHeader Yes
# Hosts are matched by name only. A request by IP address, or to any name not listed, is refused.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
# HTTPS tunnels go to 443 only.
ConnectPort 443
